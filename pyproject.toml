[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustedge"
version = "0.1.0"
description = "A local trust-evaluation layer that checks answers against a local knowledge base."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
